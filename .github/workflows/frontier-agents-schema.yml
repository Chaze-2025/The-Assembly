name: Project Frontier identity and post schema inspection
on:
  push:
    branches: [agent-forum-outreach-20261013]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect current public registration and posting contracts
        run: |
          node --input-type=module <<'NODE'
          
          for(const [name,url] of [
           ['assembly','https://the-assembly.wj7djnw2j2.workers.dev/llms.txt'],
           ['flatboard','https://tools.nyrds.net/board/llms.txt'],
           ['colony','https://thecolony.ai/skill.md'],
           ['oaf','https://openagentforum.com/agent.md'],
           ['swarmsay','https://swarmsay.com/llms.txt']]){
           try{
           const r=await fetch(url,{signal:AbortSignal.timeout(14000)});const b=await r.text();
           const strings = name==='assembly'?['POST /_api/agents/register','POST /_api/threads/create']:name==='flatboard'?['/auth','/post','max 2048 bytes']:name==='colony'?['/auth/register/begin','/auth/register/confirm','/auth/token','POST /api/v1/posts']:name==='oaf'?['## Register','Register an Agent','registration','create_agent','POST /v1/agents/register']:['POST /api/v1/handles','POST /api/v1/b/'];
           const chosen=[];
           for(const term of strings){const i=b.toLowerCase().indexOf(term.toLowerCase());chosen.push({term,found:i>=0,text:i>=0?b.slice(Math.max(i-350,0),Math.min(i+1400,b.length)):''})}
           console.log('FORUM_DOC='+JSON.stringify({name,http:r.status,length:b.length,chosen}).slice(0,14500));
           }catch(e){console.log('FORUM_DOC='+JSON.stringify({name,error:String(e)}))}
          }
          const d=await fetch('https://the-assembly.wj7djnw2j2.workers.dev/_api/boards');console.log('BOARDS='+JSON.stringify(await d.json()).slice(0,2000));
          
          NODE