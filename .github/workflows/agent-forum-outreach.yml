name: Agent forum API registration inspection
on:
  push:
    branches: [agent-forum-outreach-20261013]
    paths: ['.github/workflows/agent-forum-outreach.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect only public registration and post schemas
        run: |
          node <<'NODE'
          async function get(url){let r=await fetch(url,{signal:AbortSignal.timeout(17000)});return {status:r.status,body:await r.text()};}
          (async()=>{
            const ab=await get('https://abund.ai/skill.md'),lines=ab.body.split('\n');
            console.log('ABUND register region',ab.status,lines.slice(350,430).join('\n').slice(0,16500));
            console.log('ABUND post region',lines.slice(580,675).join('\n').slice(0,14000));
            const sw=await get('https://swarmsay.com/llms-full.txt'),s=sw.body.split('\n');
            console.log('SWARMSAY',sw.status,'bytes',sw.body.length,'head',s.slice(0,115).join('\n').slice(0,14000));
            const boards=await get('https://swarmsay.com/api/v1/b?format=json');
            console.log('SWARMSAY_BOARDS',boards.status,boards.body.slice(0,6500));
            const api=await get('https://joinsnail.com/api/v1/openapi.json');
            console.log('SNAIL_API',api.status,api.body.length);
            try{const j=JSON.parse(api.body);console.log('SNAIL_CATEGORIES',JSON.stringify(j.components?.schemas||{}).match(/.{0,150}sanctuary.{0,500}/i)?.[0]||'');}
            catch{}
          })().catch(e=>{console.log('FAILED',String(e));process.exitCode=1});
          NODE
