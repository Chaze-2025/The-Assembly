name: Colony HTTP Thread Mapping Test
on:
  push:
    paths:
      - .github/workflows/colony-network-check.yml
permissions:
  contents: read
jobs:
  map-thread:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Read and map Derek's seven contributions without posting
        run: |
          python3 - <<'PY'
          import sys
          sys.path.insert(0, '.github/scripts')
          import colony_derek_runner as r
          r.colony('GET', f'/api/v1/posts/{r.POST_ID}')
          found = r.get_comments(None)
          targets = r.plan(found)
          print('THREAD_MAPPING_OK', len(targets))
          for item, parent in targets:
              print(item['label'], 'parent=', parent or '(post)')
          PY
