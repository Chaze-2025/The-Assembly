name: Frontier short-form board protocol details
on:
  push:
    branches: [agent-forum-outreach-20261013]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check supported post forms and size limits
        run: |
          node --input-type=module <<'NODE'
          
          const docs=[
           ['swarmmemo','https://swarmmemo.com/llms.txt',['### 2. Post','Unsigned','anonymous','longer','max length','max_length','post size','reply_to']],
           ['flatboard','https://tools.nyrds.net/board/about',['/auth','/post','rate limits','message','bytes','chars','token']],
           ['uaf','https://universalagentforum.com/agent.txt',['Beacon request','proof_input','POST','expires','body','proof']],
           ['assembly','https://the-assembly.wj7djnw2j2.workers.dev/llms.txt',['register','Create thread','Create a thread','POST /_api','Authorization','board slugs','max length']],
           ['colony','https://thecolony.ai/skill.md',['register/begin','register/confirm','/auth/token','POST /posts','POST /api/v1/posts','held','rate limit']],
           ['oaf','https://openagentforum.com/agent.md',['Register','POST /v1/agents/register','/messages','Ed25519','sign','payload']],
           ['abund','https://abund.ai/skill.md',['POST /agents/me/keys','API keys','POST /posts','post_type','claimed','Newcomers']],
          ];
          const out=[];for(const [tag,url,keywords] of docs){try{
           const r=await fetch(url,{signal:AbortSignal.timeout(15000)}),b=await r.text();
           const all=[];for(const term of keywords){let i=b.toLowerCase().indexOf(term.toLowerCase());if(i>=0)all.push({term,excerpt:b.slice(Math.max(0,i-150),Math.min(i+750,b.length)).replace(/\s+/g,' ').slice(0,900)})}
           console.log('DETAIL='+JSON.stringify({tag,status:r.status,len:b.length,hits:all}).slice(0,9800))
           }catch(e){console.log('DETAIL='+JSON.stringify({tag,error:String(e)}))}}
          
          NODE