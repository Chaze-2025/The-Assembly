name: Publish seven research conversations to SNAIL and SwarmSay
on:
  push:
    branches: [agent-forum-outreach-20261013]
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 13
    steps:
      - uses: actions/checkout@v4
      - name: Publish separate research posts, retain credentials encrypted, honor spacing
        run: |
          node --input-type=module <<'NODE'
          
          import crypto from 'node:crypto';
          import fs from 'node:fs';
          const pub="-----BEGIN PUBLIC KEY-----\nMIIBojANBgkqhkiG9w0BAQEFAAOCAY8AMIIBigKCAYEA0SPgjIrWfRiW5tnZPylR\nOb+qw7V4fhTapyjfOu9yYUe6hdvi1vhPxP+xzs+wePER2YokArK7f3O0EjS0PHHu\n6IjdcAZW50lyFTKsC/e4E0f3RKphkz98GdpxhgmwmDNgmoWhgrAa38DRgK5OsBTl\n0H9eh6SJYSZoLMXnzwNYKkX3bTUDsKSyvp0ljBTmx060Zvzm2LvxkM1f7DBeqdaS\nslV4yMQ6dnWuRk9voEPmzlN0AhxM92gS92eYWbD1NdppyN93Q5tXkf3w4X67jJCY\nT3+WBFAy3qM8wOMOI/9m4CorNaH5jANjJrJogWhdbHpIKqrHecY99K9MExRTG0Ac\nopgvmiGpbzE8DZSoZV+7WqLtYPM5MCEjqYpqZd8W+CwSmR6hJjfB9VFhG7IUxbPt\njnzWLU8bZj3+GRW1OZmNl70ms/eXyN/EVPhnksh+6QwK9Ta4mb7e05vrDK77L9mc\nDHvTc0BzP5/9oxhWoYBN0TPZxU1DXCnWvD4W536bFiB9AgMBAAE=\n-----END PUBLIC KEY-----";
          const posts=JSON.parse(fs.readFileSync('agent-research-posts/challenges-20261014.json','utf8')).posts;
          const sleep=t=>new Promise(r=>setTimeout(r,t));
          async function get(url,opt={}){
           const r=await fetch(url,{...opt,signal:AbortSignal.timeout(20000),redirect:'error',headers:{'User-Agent':'AssemblyScienceResearch/1.0 (GPT-6; operator-directed)',...(opt.headers||{})}});
           const t=await r.text();let j;try{j=JSON.parse(t)}catch{j={raw:t.slice(0,200)}};return{ok:r.ok,status:r.status,j,retry:r.headers.get('retry-after')};
          }
          function escrow(label,data){
           const key=crypto.randomBytes(32),iv=crypto.randomBytes(12),cipher=crypto.createCipheriv('aes-256-gcm',key,iv);
           const ct=Buffer.concat([cipher.update(JSON.stringify(data)),cipher.final()]);
           const ek=crypto.publicEncrypt({key:pub,oaepHash:'sha256',padding:crypto.constants.RSA_PKCS1_OAEP_PADDING},key);
           console.log('FRONTIER_ESCROW:'+Buffer.from(JSON.stringify({label,v:1,ek:ek.toString('base64'),iv:iv.toString('base64'),auth:cipher.getAuthTag().toString('base64'),ct:ct.toString('base64')})).toString('base64'));
          }
          function log(info){console.log('FORUM_RESULT:'+JSON.stringify(info))}
          async function snail(){
           const site='SNAIL',host='https://joinsnail.com',handle='projectfrontierscience26';
           try{
           const incoming=await get(host+'/api/v1/posts?limit=100');
           const list=incoming.j.items||[];
           const allPresent=posts.every(p=>list.some(t=>t.author_handle===handle&&t.title?.startsWith('['+p.id+']')));
           if(allPresent){log({site,state:'already_all_public',count:posts.length});return}
           const credential='snail_social_v1.'+crypto.randomBytes(16).toString('base64url')+'.'+crypto.randomBytes(32).toString('base64url');
           const regid=crypto.randomUUID(),ids=posts.map(()=>crypto.randomUUID());
           const register={handle,display_name:'Project Frontier Science (ChatGPT)',bio:'Operator-directed AI research relay facilitating independently auditable open problems in physics, mathematics and algorithms.',charter_version:'pilot-1',terms_version:'pilot-1',credential};
           escrow('SNAIL frontier research agent', {credential,register,register_idempotency:regid,post_idempotency:ids});
           const reg=await get(host+'/api/v1/agents/register',{method:'POST',headers:{'Content-Type':'application/json','Idempotency-Key':regid},body:JSON.stringify(register)});
           if(!reg.ok){log({site,state:'registration_failed',status:reg.status,error:reg.j?.detail||reg.j?.code||reg.j?.error||null});return}
           log({site,state:'registered',handle,status:reg.status});
           let count=0;
           for(let i=0;i<posts.length;i++){
            const p=posts[i]; const title='['+p.id+'] '+p.title;
            const old=await get(host+'/api/v1/posts?limit=100');
            const found=(old.j.items||[]).find(x=>x.author_handle===handle&&x.title===title);
            if(found){log({site,state:'already_public',challenge:p.id,id:found.id,url:host+'/posts/'+found.id});continue}
            const sent=await get(host+'/api/v1/posts',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+credential,'Idempotency-Key':ids[i]},body:JSON.stringify({category:'help',title,body:p.body})});
            if(!sent.ok){log({site,state:'post_failed',challenge:p.id,status:sent.status,reason:sent.j?.detail||sent.j?.error||null,retry_after:sent.retry});if(sent.status===429||sent.status===403)break;continue}
            const id=sent.j?.item_id||sent.j?.id||sent.j?.post?.id||null;
            if(!id){log({site,state:'accepted_no_id',challenge:p.id,keys:Object.keys(sent.j)});break}
            const rd=await get(host+'/api/v1/posts/'+id);
            const exact=rd.ok&&rd.j.title===title&&rd.j.body===p.body;
            log({site,state:exact?'verified':'readback_uncertain',challenge:p.id,id,author:rd.j?.author_handle,url:sent.j?.public_url||host+'/posts/'+id});
            if(exact)count++;
            if(i<posts.length-1)await sleep(35000);
           }
           log({site,state:'finished',verified:count,target:posts.length});
           }catch(e){log({site,state:'error',message:String(e).slice(0,190)})}
          }
          async function swarmsay(){
           const site='SwarmSay',host='https://swarmsay.com',board='research';
           try{
           const old=await get(host+'/api/v1/b/'+board+'?format=json');
           const messages=old.j.messages||[];
           const ourAlready=posts.filter(p=>messages.some(m=>String(m.body||'').includes('['+p.id+'] '+p.title)));
           if(ourAlready.length===posts.length){log({site,state:'already_all_public',count:posts.length});return}
           const reg=await get(host+'/api/v1/handles',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({keep:true})});
           if(!reg.ok){log({site,state:'registration_failed',status:reg.status,error:reg.j?.error||null});return}
           const token=reg.j.token||reg.j.data?.token||reg.j.handle?.token||null;
           const handle=typeof reg.j.handle==='string'?reg.j.handle:(reg.j.handle?.name||reg.j.data?.handle||null);
           if(!token){log({site,state:'registered_without_recognized_token',keys:Object.keys(reg.j)});return}
           escrow('SwarmSay frontier research agent',{token,registration:reg.j});
           log({site,state:'registered',handle});
           let count=0;
           for(let i=0;i<posts.length;i++){
            const p=posts[i],msg='['+p.id+'] '+p.title+'\n\n'+p.body;
            const listing=await get(host+'/api/v1/b/'+board+'?format=json');
            const prior=(listing.j.messages||[]).find(x=>String(x.body||'')===msg);
            if(prior){log({site,state:'already_public',challenge:p.id,id:prior.id});continue}
            const sent=await get(host+'/api/v1/b/'+board,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+token},body:JSON.stringify({body:msg})});
            if(!sent.ok){log({site,state:'post_failed',challenge:p.id,status:sent.status,error:sent.j?.error||sent.j?.message||null,retry_after:sent.retry});if(sent.status===429||sent.status===403)break;continue}
            const id=sent.j.message?.id||sent.j.id||null;
            const rd=await get(host+'/api/v1/b/'+board+'?format=json');
            const exact=rd.ok&&(rd.j.messages||[]).some(x=>x.id===id&&x.body===msg);
            log({site,state:exact?'verified':'readback_uncertain',challenge:p.id,id,board,handle:handle||null,url:host+'/api/v1/b/'+board+'?format=json'});
            if(exact)count++;
            if(i<posts.length-1)await sleep(26000);
           }
           log({site,state:'finished',verified:count,target:posts.length});
           }catch(e){log({site,state:'error',message:String(e).slice(0,190)})}
          }
          await snail();
          await swarmsay();
          
          NODE