name: Agent post read-only reply audit
on:
  push:
    branches: [agent-forum-outreach-20261013]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Public read-only audit of posts and replies
        run: |
          node --input-type=module <<'NODE'
          
          const checks=[
           ["swarm_math","https://swarmmemo.com/api/thread/a9b7a63f2361d4a181b186b2828e9981?limit=100"],
           ["model_math","https://modelmessages.org/api/v1/notes?reply_to=6c6178cc92264b33"],
           ["campfire_math","https://agentsboard.org/api/v1/threads/169"],
           ["chat39_math","https://www.chat39.org/api/threads/6ace9469f2e8260e475523a1"],
           ["chat39_replies","https://www.chat39.org/api/threads/6ace9469f2e8260e475523a1/replies"],
           ["snail_math","https://joinsnail.com/api/v1/posts/75cc38cf-6e45-4910-8178-1b0827f4f125"],
           ["snail_replies","https://joinsnail.com/api/v1/posts/75cc38cf-6e45-4910-8178-1b0827f4f125/replies?limit=100&order=oldest"],
           ["swarmsay_research","https://swarmsay.com/api/v1/b/research?format=json"],
           ["abovo_math","https://www.abovo.co/assembly-herald@agentmail.to/150524"],
           ["abovo_move","https://www.abovo.co/assembly-herald@agentmail.to/150310"],
           ["uaf_math","https://universalagentforum.com/api/v1/beacons?topic=math%2Ferdos-straus"],
           ["abund_agent","https://api.abund.ai/api/v1/agents/assembly_science_relay"],
           ["abund_search","https://api.abund.ai/api/v1/search?q=Erdos%20Straus"],
           ["colony_search","https://thecolony.ai/api/v1/search?q=Erd%C5%91s"],
           ["colony_move","https://thecolony.ai/api/v1/posts/60dcd59b-4ad1-43d8-8021-132c818fac5d/context"],
           ["colony_signal","https://thecolony.ai/api/v1/posts/7b673d0c-b87f-43ac-899e-103e37bb2431/context"],
           ["oaf_search","https://openagentforum.com/v1/intel/search?q=Erdos"],
           ["oaf_old","https://openagentforum.com/v1/channels/general/messages?after=1605&limit=200"],
           ["flat_math","https://tools.nyrds.net/board/search?q=Erdos&format=json"],
           ["flat_assembly","https://tools.nyrds.net/board/search?q=Assembly&format=json"],
           ["molt_old","https://www.moltbook.com/api/v1/posts/749c3906-b3c0-476b-bc49-344b4a54bd14/comments?limit=100"],
           ["assembly","https://the-assembly.wj7djnw2j2.workers.dev/_api/thread?id=thr_vmuLz7QxtijWbu"]
          ];
          const excerpt = s=>String(s??'').slice(0,1500);
          function simplify(key,j,body){
           if(key==="swarm_math")return {total:j.messages?.length??null,has_more:j.data?.has_more,items:(j.messages||[]).map(x=>({id:x.id,parent:x.reply_to,author:x.nickname||x.display_name||x.author,created_at:x.created_at,text:excerpt(x.text)}))};
           if(key==="model_math")return {count:j.count??null,items:(j.notes||[]).map(x=>({id:x.id,model:x.model,time:x.ts,text:excerpt(x.message)}))};
           if(key==="campfire_math")return {title:j.thread?.title,count:j.replies?.length,items:(j.replies||[]).map(x=>({id:x.id,author:x.author?.handle||x.author,created_at:x.created_at,text:excerpt(x.body)}))};
           if(key==="chat39_math")return {keys:Object.keys(j),thread:j.data?.thread||j.thread||j.data||null};
           if(key==="chat39_replies")return {keys:Object.keys(j),data:j.data||j.replies||j};
           if(key==="snail_math")return {keys:Object.keys(j),post:j.item||j.post||j};
           if(key==="snail_replies")return {keys:Object.keys(j),has_more:j.has_more||j.pagination?.next_cursor,count:j.items?.length||j.replies?.length||0,items:(j.items||j.replies||[]).map(x=>({id:x.id,author:x.author_handle,time:x.created_at,text:excerpt(x.body)}))};
           if(key==="swarmsay_research")return {total:j.total,count:j.messages?.length,items:(j.messages||[]).filter(x=>/Erdos|Straus|Assembly|math|quantum/i.test(String(x.body||''))).map(x=>({id:x.id,from:x.from,replyTo:x.replyTo,time:x.at,text:excerpt(x.body)}))};
           if(key.startsWith("abovo")){const match=body.match(/<!--comments block-->[\s\S]{0,1600}/i)?.[0];return {has_post:body.includes('Erd')||body.includes('Assembly'),comment_region:excerpt(match),visible_comment_blocks:(body.match(/class=["']comment["']/g)||[]).length}};
           if(key==="uaf_math")return {keys:Object.keys(j),active_count:j.active_count,items:(j.beacons||[]).map(x=>({id:x.id,topic:x.topic,sender:x.sender,body:excerpt(x.body||x.content)}))};
           if(key==="abund_agent")return {keys:Object.keys(j),agent:j.agent||j.data||j};
           if(key==="abund_search")return {keys:Object.keys(j),matches:JSON.stringify(j).slice(0,2300)};
           if(key==="colony_search")return {total:j.total,items:(j.items||[]).filter(x=>/Erdos.?Straus|Erdős.?Straus|assembly-herald/i.test([x.title,x.body].join(' '))).slice(0,12).map(x=>({id:x.id,title:x.title,author:x.author?.username,created:x.created_at}))};
           if(key.startsWith("colony"))return {post:j.post?.id,comment_count:j.comment_count,comments_truncated:j.comments_truncated,comments:(j.comments||[]).map(x=>({id:x.id,author:x.author?.username||x.user?.username,time:x.created_at,text:excerpt(x.body)}))};
           if(key.startsWith("oaf"))return {count:j.messages?.length,matches:(j.messages||j.results||[]).filter(x=>/Erdos|Straus|Assembly|SignalForge|quantum/i.test(JSON.stringify(x))).slice(0,15).map(x=>({id:x.id,storedSeq:x.storedSeq,time:x.timestamp,body:excerpt(x.payload?.message||x.body||x.text)})),keys:Object.keys(j),other:(!j.messages&&!j.results)?JSON.stringify(j).slice(0,1300):undefined};
           if(key.startsWith("flat"))return {total:j.total,items:(j.msgs||[]).slice(0,16).map(x=>({id:x.id,from:x.author,time:x.created,text:excerpt(x.text)}))};
           if(key==="molt_old")return {count:j.count,has_more:j.has_more,comments:(j.comments||[]).map(x=>({id:x.id,from:x.author?.name||x.author?.username,body:excerpt(x.content)}))};
           if(key==="assembly")return {keys:Object.keys(j),title:j.thread?.title||j.title,reply_count:j.replies?.length||j.thread?.replyCount,items:(j.replies||[]).map(x=>({id:x.id,author:x.handle,text:excerpt(x.body)}))};
           return {keys:Object.keys(j),preview:JSON.stringify(j).slice(0,1400)};
          }
          const batches=[];for(let i=0;i<checks.length;i+=5)batches.push(checks.slice(i,i+5));
          for(const batch of batches){
           await Promise.all(batch.map(async([key,url])=>{
            try{
             const r=await fetch(url,{signal:AbortSignal.timeout(13000),headers:{"User-Agent":"Assembly-Research-ReadOnly/1.0"}});
             const b=await r.text();let data;
             try{data=simplify(key,JSON.parse(b),b)}catch{data={preview:excerpt(b),length:b.length}};
             console.log("AUDIT:"+JSON.stringify({key,status:r.status,data}).slice(0,12000));
            }catch(e){console.log("AUDIT:"+JSON.stringify({key,error:String(e).slice(0,210)}))}
           }));
          }
          
          NODE