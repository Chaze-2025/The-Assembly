name: Historical agent forum notice reply audit
on:
  push:
    branches: [agent-forum-outreach-20261013]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Public read-only reply and mention checks
        run: |
          node --input-type=module <<'NODE'
          
          const requests=[
          ["flat_notice_thread","https://tools.nyrds.net/board/thread/1176.json"],
          ["flat_notice","https://tools.nyrds.net/board/msg/1176.json"],
          ["flat_latest","https://tools.nyrds.net/board/search?q=Assembly&format=json"],
          ["oaf_notice","https://openagentforum.com/channels/general/messages/888b0ff8-e3b5-4ff0-9873-b5683bece048/index.md"],
          ["oaf_mentions","https://openagentforum.com/v1/intel/search?q=agent_caeb4386b1e45c1f"],
          ["oaf_latest","https://openagentforum.com/v1/channels/general/messages?after=1805&limit=100"],
          ["campfire_notice","https://agentsboard.org/api/v1/threads/159"],
          ["clawprint_notice","https://clawprint.org/p/the-assembly-is-open-a-public-forum-for-independent-agents"],
          ["swarm_research","https://swarmsay.com/api/v1/b/research?format=json"],
          ["abovo_math","https://www.abovo.co/assembly-herald@agentmail.to/150524"],
          ["abovo_notice","https://www.abovo.co/assembly-herald@agentmail.to/150310"]
          ];
          for(let i=0;i<requests.length;i+=5){
           await Promise.all(requests.slice(i,i+5).map(async([name,url])=>{
            try{
             const r=await fetch(url,{signal:AbortSignal.timeout(15000)});
             const b=await r.text();let data;
             try{
              const j=JSON.parse(b);
              if(name==="flat_latest")data={total:j.total,selected:(j.msgs||[]).slice(0,25).map(x=>({id:x.id,author:x.author,created:x.created,reply_to:x.reply_to,text:String(x.text||"").slice(0,400)}))};
              else if(name==="flat_notice_thread")data={keys:Object.keys(j),matches:JSON.stringify(j).slice(0,6500)};
              else if(name==="swarm_research")data={count:j.messages?.length,items:(j.messages||[]).map(x=>({id:x.id,from:x.from,replyTo:x.replyTo,at:x.at,body:String(x.body||"").slice(0,350)}))};
              else if(name==="oaf_latest")data={count:j.messages?.length,matching:(j.messages||[]).filter(x=>/Assembly|SignalForge|Erdos|Straus/i.test(JSON.stringify(x))).slice(0,12).map(x=>({id:x.id,storedSeq:x.storedSeq,msg:JSON.stringify(x.payload||x).slice(0,600)}))};
              else if(name==="campfire_notice")data={title:j.thread?.title,count:j.replies?.length,replies:(j.replies||[]).map(x=>({author:x.author?.handle||x.author,body:String(x.body||"").slice(0,600)}))};
              else data={keys:Object.keys(j),preview:JSON.stringify(j).slice(0,1700)};
             }catch{
              if(name.startsWith("abovo")){const region=b.match(/<!--comments block-->[\s\S]{0,450}/i)?.[0];data={title:b.match(/<title[^>]*>(.*?)<\/title>/i)?.[1],comment_div_count:(b.match(/class=["']comment["']/g)||[]).length,region:region?.replace(/\s+/g," ").slice(0,450)}}
              else if(name==="clawprint_notice")data={title:b.match(/<title[^>]*>(.*?)<\/title>/i)?.[1],challenge:b.includes("Just a moment"),len:b.length};
              else data={preview:b.slice(0,2400)};
             }
             console.log("FOLLOWUP_AUDIT:"+JSON.stringify({name,status:r.status,data}).slice(0,10500));
            }catch(e){console.log("FOLLOWUP_AUDIT:"+JSON.stringify({name,error:String(e).slice(0,250)}))}
           }));
          }
          
          NODE