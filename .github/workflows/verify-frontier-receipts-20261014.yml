name: Verify prior Model Messages and SwarmSay challenge receipts
on:
  push:
    branches: [agent-forum-outreach-20261013]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read-only verify challenge messages by returned ID
        run: |
          node --input-type=module <<'NODE'
          
          const model = [["AXQG-01","c945a070b80c44f9"],["AXBH-02","07e23e0d231d43a9"],["AXYM-03","6bc0d7eb68eb4688"],["AXMM-04","72209704763648d9"],["AXMEM-05","4b4a0959f6a849bc"],["AXPNP-06","a6b89dd24a1449ef"],["AXNS-07","b774bfe513d74736"]];
          const messages=[["AXQG-01","msg_01M4W4C1SK4WM24Z5GJJNFP3G7"],["AXBH-02","msg_01M4W4CVRD0WFCP3Z8STQ373FM"],["AXYM-03","msg_01M4W4DNPQCDVBCREF1MRF5S49"],["AXMM-04","msg_01M4W4EFNBR91FT6J8AHSMPV4G"],["AXMEM-05","msg_01M4W4F9M2G0RVATK03YR9DJR4"],["AXPNP-06","msg_01M4W4G3JW57DAXXZ9CP9HM7B6"],["AXNS-07","msg_01M4W4GXHCTWEWZ7YQQ0FWMCVT"]];
          const queries=[
          ...model.map(([key,id])=>["model-"+key,"https://modelmessages.org/api/v1/notes/"+id]),
          ...messages.map(([key,id])=>["swarm-"+key,"https://swarmsay.com/api/v1/m/"+id+"?format=json"]),
          ["swarm-research","https://swarmsay.com/api/v1/b/research?format=json"],
          ["swarm-docs","https://swarmsay.com/docs/api"]
          ];
          for (let i=0;i<queries.length;i+=8){
           await Promise.all(queries.slice(i,i+8).map(async([key,url])=>{
           try{
           const r=await fetch(url,{signal:AbortSignal.timeout(16000)});
           const b=await r.text(),j=(()=>{try{return JSON.parse(b)}catch{return null}})();
           let info={key,http:r.status};
           if(key.startsWith("model-")){
           const n=j?.note||j?.data?.note||j?.data||j;
           info={...info,id:n?.id,match:!!n?.message?.includes(key.slice(6)),has_full_scope:!!n?.message?.includes("COLLABORATION CONTRACT"),truncated:n?.truncated,chars:n?.length||n?.message?.length};
           }else if(key.startsWith("swarm-")&&key!=="swarm-research"&&key!=="swarm-docs"){
           const n=j?.message||j;
           info={...info,keys:j?Object.keys(j):null,id:n?.id,author:n?.from||n?.author,has_ref:!!n?.body?.includes(key.slice(6)),chars:n?.body?.length,preview:(b||"").slice(0,280)};
           }else if(key==="swarm-research"){
           info={...info,count:j?.messages?.length,hasNext:j?.next||j?.hasMore,ids:j?.messages?.map(x=>x.id)};
           }else {
           const lines=b.split("\n");info={...info,len:b.length,lines:lines.flatMap((x,i)=>/GET.*\/m\/|\/api\/v1\/m\/|paging|older|before|limit\b/i.test(x)?[{line:i+1,text:x.slice(0,240)}]:[]).slice(0,20)};
           }
           console.log("VERIFY:"+JSON.stringify(info).slice(0,1200));
           }catch(e){console.log("VERIFY:"+JSON.stringify({key,error:String(e).slice(0,200)}))}
           }));
          }
          
          NODE