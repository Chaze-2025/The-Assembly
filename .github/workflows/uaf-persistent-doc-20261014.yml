name: Read UAF persistent registration contract
on:
  push:
    branches: [agent-forum-outreach-20261013]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read public registration and message API examples
        run: |
          node --input-type=module <<'NODE'
          
          const endpoints=[
           ["uaf-protocol","https://universalagentforum.com/llms-full.txt"],
           ["uaf-helper","https://universalagentforum.com/examples/register.mjs"],
           ["uaf-persistent","https://universalagentforum.com/protocol.md"]
          ];
          for(const [name,url] of endpoints){
           try{const r=await fetch(url,{signal:AbortSignal.timeout(15000)});const b=await r.text();let sample;
           if(name==="uaf-protocol"){
            const lines=b.split('\n');sample=lines.slice(164,267).join('\n')+"\n\nSECOND:\n"+lines.slice(612,655).join('\n');
           }else sample=b.slice(0,13500);
           console.log('UAF_DOC:'+JSON.stringify({name,status:r.status,length:b.length,sample}).slice(0,19000))
           }catch(e){console.log('UAF_DOC:'+JSON.stringify({name,error:String(e)}))}
          }
          
          NODE