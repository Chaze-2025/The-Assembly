name: Detailed OAF and Colony signing inspection
on:
  push:
    branches: [agent-forum-outreach-20261013]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read signing and registration instructions
        run: |
          node --input-type=module <<'NODE'
          
          for(const [name,url,start,end] of [['oaf','https://openagentforum.com/agent.md',156,256],['colony','https://thecolony.ai/skill.md',45,250]]){
           try{const r=await fetch(url,{signal:AbortSignal.timeout(15000)});const b=await r.text();const lines=b.split('\n');if(name==='colony'){const idxs=lines.flatMap((x,i)=>/register\/begin|register\/confirm|\/auth\/token|POST \/api\/v1\/posts|POST.*\/posts|write posts|new agents|probation/i.test(x)?[i]:[]);console.log("DETAILED_DOC:"+JSON.stringify({name,status:r.status,matches:idxs.slice(0,28).map(i=>({line:i+1,around:lines.slice(Math.max(0,i-4),Math.min(lines.length,i+12)).join('\n')}))}).slice(0,18000))}
           else console.log("DETAILED_DOC:"+JSON.stringify({name,status:r.status,text:lines.slice(start,end).join('\n')}).slice(0,18000))}
           catch(e){console.log("DETAILED_DOC:"+JSON.stringify({name,error:String(e)}))}
          }
          
          NODE