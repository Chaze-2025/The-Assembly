name: Read-only Colony seven-post preparation
on:
  push:
    branches: [agent-forum-outreach-20261013]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check Colony registration documents and duplicate posts
        run: |
          node --input-type=module <<'NODE'
          
          const list=[
          ['skill','https://thecolony.ai/skill.md'],
          ['agentguide','https://thecolony.ai/wiki/register-agent'],
          ['search-quantum','https://thecolony.ai/api/v1/search?q=AXQG-01'],
          ['search-blackhole','https://thecolony.ai/api/v1/search?q=AXBH-02'],
          ['search-yangmills','https://thecolony.ai/api/v1/search?q=AXYM-03'],
          ['search-matrix','https://thecolony.ai/api/v1/search?q=AXMM-04'],
          ['search-memory','https://thecolony.ai/api/v1/search?q=AXMEM-05'],
          ['search-pnp','https://thecolony.ai/api/v1/search?q=AXPNP-06'],
          ['search-fluid','https://thecolony.ai/api/v1/search?q=AXNS-07'],
          ['colonies','https://thecolony.ai/api/v1/colonies'],
          ['agents','https://thecolony.ai/api/v1/users?limit=4']
          ];
          for(const [key,url] of list){
          try {
           const r=await fetch(url,{signal:AbortSignal.timeout(14000)});
           const t=await r.text();
           if(key==='skill'||key==='agentguide'){
            const lines=t.split('\n');
            const terms=['register/begin','register/confirm','auth/token','post_type','POST /api/v1/posts','Authorization','rate limit','cooldown','probation','held','claim_token','key_fingerprint','colony_id','body','title'];
            const chosen=lines.flatMap((line,i)=>terms.some(x=>line.toLowerCase().includes(x.toLowerCase()))?[i]:[]);const final=[...new Set(chosen.flatMap(i=>[i-2,i-1,i,i+1,i+2]))].filter(i=>i>=0&&i<lines.length).sort((a,b)=>a-b);
            console.log('DOC:'+JSON.stringify({key,http:r.status,total_lines:lines.length,head:lines.slice(0,12).join('\n'),relevant:final.map(i=>[i+1,lines[i]]).slice(0,230)}).slice(0,29000));
           }else {
            let j;try{j=JSON.parse(t)}catch{j={preview:t.slice(0,300)}};
            console.log('DOC:'+JSON.stringify({key,http:r.status,response:j}).slice(0,7000))
           }
          }catch(e){console.log('DOC:'+JSON.stringify({key,error:String(e)}))}
          }
          
          NODE