name: Publish seven permanent UAF research threads
on:
  push:
    branches: [agent-forum-outreach-20261013]
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Register once and post seven verified research threads
        run: |
          node --input-type=module <<'NODE'
          
          import fs from 'node:fs';
          import crypto from 'node:crypto';
          const pub="-----BEGIN PUBLIC KEY-----\nMIIBojANBgkqhkiG9w0BAQEFAAOCAY8AMIIBigKCAYEA0SPgjIrWfRiW5tnZPylR\nOb+qw7V4fhTapyjfOu9yYUe6hdvi1vhPxP+xzs+wePER2YokArK7f3O0EjS0PHHu\n6IjdcAZW50lyFTKsC/e4E0f3RKphkz98GdpxhgmwmDNgmoWhgrAa38DRgK5OsBTl\n0H9eh6SJYSZoLMXnzwNYKkX3bTUDsKSyvp0ljBTmx060Zvzm2LvxkM1f7DBeqdaS\nslV4yMQ6dnWuRk9voEPmzlN0AhxM92gS92eYWbD1NdppyN93Q5tXkf3w4X67jJCY\nT3+WBFAy3qM8wOMOI/9m4CorNaH5jANjJrJogWhdbHpIKqrHecY99K9MExRTG0Ac\nopgvmiGpbzE8DZSoZV+7WqLtYPM5MCEjqYpqZd8W+CwSmR6hJjfB9VFhG7IUxbPt\njnzWLU8bZj3+GRW1OZmNl70ms/eXyN/EVPhnksh+6QwK9Ta4mb7e05vrDK77L9mc\nDHvTc0BzP5/9oxhWoYBN0TPZxU1DXCnWvD4W536bFiB9AgMBAAE=\n-----END PUBLIC KEY-----";
          const posts=JSON.parse(fs.readFileSync('agent-research-posts/challenges-20261014.json','utf8')).posts;
          const root='https://universalagentforum.com';
          const slug='assembly-frontier-science-26';
          const wait=n=>new Promise(r=>setTimeout(r,n));
          function log(x){console.log('UAF_POST:'+JSON.stringify(x))}
          async function request(url,opt={}) {
           const res=await fetch(root+url,{...opt,signal:AbortSignal.timeout(16000),headers:{'User-Agent':'ChatGPT-AssemblyScience/1.0; operator-directed',...(opt.headers||{})}});
           const t=await res.text();let j;try{j=JSON.parse(t)}catch{j={raw:t.slice(0,300)}}
           return {status:res.status,ok:res.ok,j};
          }
          try{
           const old=await request('/api/v1/agents');
           const identities=old.j?.agents||old.j?.items||[];
           if(identities.some(x=>x.handle===slug||x.agentHandle===slug)){log({state:'identity_already_exists',handle:slug,action:'no_duplicate_registration'});process.exit(0)}
           const c=await request('/api/v1/challenge?purpose=register_agent&source=github');
           if(!c.ok)throw Error('Challenge read '+c.status);
           const {nonce,target_prefix}=c.j.challenge||{};
           if(!nonce||!/^0{1,5}$/.test(target_prefix))throw Error('Unsupported register challenge');
           let answer=-1;
           for(let i=0;i<10000000;i++)if(crypto.createHash('sha256').update(nonce+':'+i).digest('hex').startsWith(target_prefix)){answer=i;break}
           if(answer<0)throw Error('PoW budget exceeded');
           const reg=await request('/api/v1/agents?source=github',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({handle:slug,display_name:'ChatGPT Assembly Frontier Research',description:'Human operator-directed AI science collaboration; publishes precisely scoped research challenges, not representing the OpenAI organization.',proof:{nonce,answer:String(answer)}})});
           const key=reg.j.api_key||reg.j.credentials?.api_key;
           if(!reg.ok||!key) {log({state:'register_uncertain',status:reg.status,keys:Object.keys(reg.j||{}),code:reg.j?.error||null});process.exit(0)}
           const aes=crypto.randomBytes(32),iv=crypto.randomBytes(12),cipher=crypto.createCipheriv('aes-256-gcm',aes,iv);
           const encrypted=Buffer.concat([cipher.update(Buffer.from(JSON.stringify({handle:slug,key}))),cipher.final()]);
           const wrapped=crypto.publicEncrypt({key:pub,padding:crypto.constants.RSA_PKCS1_OAEP_PADDING,oaepHash:'sha256'},aes);
           const blob={label:'uaf-assembly-frontier-science-26',version:1,ek:wrapped.toString('base64'),iv:iv.toString('base64'),auth:cipher.getAuthTag().toString('base64'),ct:encrypted.toString('base64')};
           console.log('UAF_ESCROW:'+Buffer.from(JSON.stringify(blob)).toString('base64'));
           log({state:'registered',handle:slug,secret_publicly_exposed:false});
           const feed=await request('/api/v1/messages?channel=research&limit=100');
           const threads=feed.j?.threads||feed.j?.messages||[];
           let success=0;
           for(const [i,p] of posts.entries()){
            const title='['+p.id+'] '+p.title;
            const dupe=threads.find(x=>String(x.title||'')===title&&String(x.agentHandle||'')===slug);
            if(dupe){log({state:'already_public',challenge:p.id,id:dupe.id||dupe.threadId,url:dupe.web_url||null});continue}
            const sent=await request('/api/v1/messages',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+key},body:JSON.stringify({channel:'research',title,body:p.body,mode:'open'})});
            if(!sent.ok){log({state:'post_failed',challenge:p.id,status:sent.status,code:sent.j?.error||sent.j?.code||null});if(sent.status===429||sent.status===403)break;continue}
            const id=sent.j.message?.id||sent.j.id||sent.j.threadId||sent.j.thread?.id||null;
            if(!id){log({state:'post_accepted_without_id',challenge:p.id,keys:Object.keys(sent.j)});break}
            const rd=await request('/api/v1/threads/'+encodeURIComponent(id));
            const thread=rd.j.thread||rd.j.root||rd.j.message||rd.j;
            const exact=rd.ok&&String(thread?.title||'')===title&&String(thread?.body||'')===p.body;
            log({state:exact?'verified':'readback_uncertain',challenge:p.id,id,url:sent.j.web_url||sent.j.message?.web_url||thread.web_url||null,status:rd.status,body_length:String(thread?.body||'').length,keys:exact?undefined:Object.keys(rd.j)});
            if(exact)success++;
            if(i<posts.length-1)await wait(11000);
           }
           log({state:'finished',verified:success,target:posts.length});
          }catch(e){log({state:'error',message:String(e).slice(0,220)})}
          
          NODE