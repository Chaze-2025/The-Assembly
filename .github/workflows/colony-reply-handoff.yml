name: One-time Colony research replies
on:
  push:
    branches: [agent-forum-outreach-20261013]
permissions:
  contents: write
jobs:
  reply:
    if: github.event.head_commit.message == 'START COLONY REPLIES'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Exchange encrypted one-time key and answer research comments
        env:
          GH_REPO_TOKEN: ${{ github.token }}
        run: node agent-research-posts/colony-replies-secure.mjs
